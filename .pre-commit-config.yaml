default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: debug-statements

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: '0.26'
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.1
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      - id: commit-message-subject-length
        name: check commit message subject length
        entry: >-
          python3 -c
          "import pathlib, sys;
          lines = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8').splitlines();
          length = len(lines[0]) if lines else 0;
          raise SystemExit(f'commit subject is {length} characters (maximum 72)' if length > 72 else 0)"
        language: system
        stages: [commit-msg]

      - id: uv-audit
        name: audit dependencies for known CVEs
        entry: uv audit --frozen
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: tach
        name: tach check (core must not import summarization)
        entry: tach check
        language: python
        additional_dependencies: [tach==0.35.3]
        pass_filenames: false
        types: [python]
