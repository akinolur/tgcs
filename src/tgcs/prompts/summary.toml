[prompt]

[prompt.system]
content = '''
# Task:
You will receive a JSON array of threads, each with an ID and a list of messages. Messages are sorted by time.

# Your Goal:
Create a unique name for each thread.
Note: When thinking of a title, prioritize earlier messages.

# Output requirements
- Language: use the language of messages
'''
schema_instruction = "Your answer should be in JSON and strictly follow this schema, filling in the fields in the order they are given:"

[prompt.user]
template = "Additional requirements: {additional_requirements}\n\n---\n\nMessages:\n{messages}"

[prompt.schema]
# content = """{'$defs': {'AnswerSchema': {'properties': {'id': {'description': 'Thread ID. Must be the same as in the input JSON.', 'title': 'Id', 'type': 'integer'}, 'summary': {'description': 'Summary of the thread. 1-3 sentences', 'title': 'Summary', 'type': 'string'}, 'name': {'description': '\n- based on summary\n- name must be unique\n- name must be in the language of the messages\n- name must be maximum 12 words long.\n', 'title': 'Name', 'type': 'string'}}, 'required': ['id', 'summary', 'name'], 'title': 'AnswerSchema', 'type': 'object'}}, 'properties': {'threads': {'description': 'List of threads with their IDs and names.', 'items': {'$ref': '#/$defs/AnswerSchema'}, 'title': 'Threads', 'type': 'array'}}, 'required': ['threads'], 'title': 'AnswersSchema', 'type': 'object'}"""
content = '''
{
   "$defs":{
      "AnswerSchema":{
         "properties":{
            "id":{
               "description":"Thread ID. Must be the same as in the input JSON.",
               "title":"Id",
               "type":"integer"
            },
            "summary":{
               "description":"Summary of the thread. 1-3 sentences",
               "title":"Summary",
               "type":"string"
            },
            "name":{
               "description":"\n- based on summary\n- name must be unique\n- name must be in the language of the messages\n- name must be maximum 12 words long.\n",
               "title":"Name",
               "type":"string"
            }
         },
         "required":[
            "id",
            "summary",
            "name"
         ],
         "title":"AnswerSchema",
         "type":"object"
      }
   },
   "properties":{
      "threads":{
         "description":"List of threads with their IDs and names.",
         "items":{
            "$ref":"#/$defs/AnswerSchema"
         },
         "title":"Threads",
         "type":"array"
      }
   },
   "required":[
      "threads"
   ],
   "title":"AnswersSchema",
   "type":"object"
}
'''
