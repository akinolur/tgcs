[project]
name = "tgcs"
version = "0.0.5"
description = "Download Telegram group history and generate LLM-powered thread summaries."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["telegram", "chat", "history", "summarization", "llm"]
dependencies = [
  "telethon",
  "typer",
  "tenacity",
  "qrcode",
]

[project.urls]
Homepage = "https://github.com/akinolur/tgcs"
Repository = "https://github.com/akinolur/tgcs"
Issues = "https://github.com/akinolur/tgcs/issues"

[project.optional-dependencies]
summary = [
  "openai",
  "json-repair",
  "chevron",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # the summary extra, so tests can cover the summarization workflow
    "tgcs[summary]",
]

[tool.uv]
exclude-newer = "5 days"
# package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tgcs"]

[project.scripts]
tgcs = "tgcs.cli:app"
