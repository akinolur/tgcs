[project]
name = "tgcs"
version = "0.0.5"
description = "Download Telegram group history and generate LLM-powered thread summaries."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["telegram", "chat", "history", "summarization", "llm"]
dependencies = [
  "telethon",
  "typer",
  "tenacity",
  "qrcode",
]

[project.urls]
Homepage = "https://github.com/akinolur/tgcs"
Repository = "https://github.com/akinolur/tgcs"
Issues = "https://github.com/akinolur/tgcs/issues"

[project.optional-dependencies]
summary = [
  "openai",
  "json-repair",
  "chevron",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # the summary extra, so tests can cover the summarization workflow
    "tgcs[summary]",
]

[tool.uv]
exclude-newer = "5 days"
# package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.deptry]
# the project imports itself; `tgcs[summary]` in the dev group is not an external dep
known_first_party = ["tgcs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tgcs"]

[project.scripts]
tgcs = "tgcs.cli:app"

[tool.tach]
exclude = [
    "**/__pycache__",
    "**/*egg-info",
    "**/docs",
    "**/tests",
    "**/venv",
]
source_roots = ["src"]
forbid_circular_dependencies = true

# Layers, top to bottom. A layer may import only layers below it:
# - app may import summarization and core
# - summarization may import core
# - core may NOT import summarization or app
# Modules have no depends_on: the layers are the only rule.
# Do not run `tach sync`: it adds self-referencing depends_on to the
# multi-path summarization module, which fails the circular check.
layers = ["app", "summarization", "core"]

[[tool.tach.modules]]
path = "tgcs.cli"
layer = "app"

[[tool.tach.modules]]
paths = [
    "tgcs.commands.summarize",
    "tgcs.summary_creator",
    "tgcs.prompt_loader",
    "tgcs.workflows",
]
layer = "summarization"

# everything else under tgcs/
[[tool.tach.modules]]
path = "tgcs"
layer = "core"
