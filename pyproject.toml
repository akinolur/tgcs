[project]
name = "tgcs"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
  "telethon",
  "typer",
  "tenacity",
  "qrcode",
]

[project.optional-dependencies]
summary = [
  "openai",
  "json-repair",
  "chevron",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
exclude-newer = "5 days"
# package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tgcs"]

[project.scripts]
tgcs = "tgcs.cli:app"
